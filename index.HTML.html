    <script>
        // STREAMING_CHUNK:Initializing modal popup logic...
        function showAccessAlert(featureName) {
            document.getElementById('modal-msg').innerText = "The '" + featureName + "' section is inaccessible in this build of CDArchive.";
            document.getElementById('alert-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('alert-modal').style.display = 'none';
        }

        // STREAMING_CHUNK:Initializing Three.js First Person plain baseplate engine...
        let scene, camera, renderer, animationFrameId;
        let keys = {};
        let velocityY = 0;
        let isGrounded = true;
        let pitch = 0;
        let yaw = 0;
        let lastPointerLockExitTime = 0;

        function startDemo() {
            document.getElementById('game-overlay').style.display = 'block';
            init3D();
        }

        function init3D() {
            const container = document.getElementById('game-container');
            container.innerHTML = '';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7ec0ee); // Retro sky blue
            scene.fog = new THREE.FogExp2(0x7ec0ee, 0.003);

            camera = new THREE.PerspectiveCamera(70, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const sun = new THREE.DirectionalLight(0xffffff, 0.85);
            sun.position.set(80, 120, 60);
            sun.castShadow = true;
            scene.add(sun);

            // Plain Baseplate with Decal texture repeated across surface
            const textureLoader = new THREE.TextureLoader();
            const textureUrl = "https://tr.rbxcdn.com/180DAY-c13853a0a2ba6b7dadfd3752f71b6cc3/420/420/Decal/Webp/noFilter";

            const baseplateTexture = textureLoader.load(textureUrl, function(tex) {
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(40, 40);
            });

            const baseplateGeo = new THREE.BoxGeometry(200, 2, 200);
            const baseplateMat = new THREE.MeshLambertMaterial({ 
                map: baseplateTexture,
                color: 0xffffff 
            });

            const baseplate = new THREE.Mesh(baseplateGeo, baseplateMat);
            baseplate.position.set(0, -1, 0);
            baseplate.receiveShadow = true;
            scene.add(baseplate);

            const canvas = renderer.domElement;

            // Click canvas to acquire pointer lock with cooldown check to prevent SecurityError
            canvas.addEventListener('click', () => {
                const now = Date.now();
                if (now - lastPointerLockExitTime > 400) {
                    canvas.requestPointerLock();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                if (!document.pointerLockElement) {
                    lastPointerLockExitTime = Date.now();
                }
            });

            document.addEventListener('mousemove', onMouseMove);
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', onWindowResize);

            animate3D();
        }

        function onMouseMove(e) {
            if (document.pointerLockElement === renderer.domElement) {
                const sensitivity = 0.0022;
                yaw -= e.movementX * sensitivity;
                pitch -= e.movementY * sensitivity;
                pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitch));
            }
        }

        function onKeyDown(e) { keys[e.key.toLowerCase()] = true; }
        function onKeyUp(e) { keys[e.key.toLowerCase()] = false; }

        function onWindowResize() {
            const container = document.getElementById('game-container');
            if (!renderer || document.getElementById('game-overlay').style.display !== 'block') return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate3D() {
            animationFrameId = requestAnimationFrame(animate3D);

            const euler = new THREE.Euler(0, 0, 0, 'YXZ');
            euler.x = pitch;
            euler.y = yaw;
            camera.quaternion.setFromEuler(euler);

            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0;
            right.normalize();

            // Slower walk speed (~0.12)
            const slowSpeed = 0.12;
            const moveDir = new THREE.Vector3();

            if (keys['w'] || keys['arrowup']) moveDir.add(forward);
            if (keys['s'] || keys['arrowdown']) moveDir.sub(forward);
            if (keys['d'] || keys['arrowright']) moveDir.add(right);
            if (keys['a'] || keys['arrowleft']) moveDir.sub(right);

            if (moveDir.length() > 0) {
                moveDir.normalize();
                camera.position.addScaledVector(moveDir, slowSpeed);
            }

            if (keys[' '] && isGrounded) {
                velocityY = 0.25;
                isGrounded = false;
            }

            velocityY -= 0.012; // Gravity
            camera.position.y += velocityY;

            if (camera.position.y <= 3.5) {
                camera.position.y = 3.5;
                velocityY = 0;
                isGrounded = true;
            }

            camera.position.x = Math.max(-95, Math.min(95, camera.position.x));
            camera.position.z = Math.max(-95, Math.min(95, camera.position.z));

            renderer.render(scene, camera);
        }
    </script>
</body>
